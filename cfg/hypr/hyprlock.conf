general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(24, 24, 24)
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 72
    font_family = Sans

    position = 0, 180
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = rgba(220, 220, 220, 1.0)
    font_size = 20
    font_family = Sans

    position = 0, 70
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    outer_color = rgba(255, 255, 255, 0.7)
    inner_color = rgba(40, 40, 40, 1.0)
    font_color = rgba(255, 255, 255, 1.0)

    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL</i>

    dots_center = true
    fade_on_empty = false
    rounding = 10

    position = 0, 0
    halign = center
    valign = center
}