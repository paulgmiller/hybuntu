general {
    # When logind asks the session to lock, start hyprlock.
    lock_cmd = pidof hyprlock || hyprlock --grace 300

    # If GDM/logind successfully unlocks the session, dismiss hyprlock.
    unlock_cmd = pkill -USR1 hyprlock

    # Always lock before the machine itself suspends.
    before_sleep_cmd = loginctl lock-session

    # Make sure monitors come back on after resume.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Start hyprlock at 10 minutes.
# For the next 5 minutes it is in its grace period. (see lock_cmd above)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Let hyprlock finish establishing its surfaces, then power displays down.
listener {
    timeout = 605
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}